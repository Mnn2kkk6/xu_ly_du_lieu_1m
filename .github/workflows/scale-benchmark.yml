name: Scale Benchmark (1M / 10M / 100M)

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Dataset size"
        required: true
        default: "1m"
        type: choice
        options:
          - 1m
          - 10m
          - 100m

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PySpark
        run: python -m pip install --upgrade pip pyspark==3.5.9

      - name: Run scale benchmark
        run: |
          spark-submit bigdata_scale_pyspark.py \
            --rows "${{ inputs.rows }}" \
            --output-dir output

      - name: Show generated output
        run: |
          find output/${{ inputs.rows }} -maxdepth 3 -type f -printf "%p %k KB\n"
          cat output/${{ inputs.rows }}/benchmark_metrics.json

      - name: Upload scale output
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.rows }}
          path: data/scale/${{ inputs.rows }}/benchmark_metrics.json
          if-no-files-found: error

      - name: Commit benchmark metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/${{ inputs.rows }}/benchmark_metrics.json output/${{ inputs.rows }}/summary.csv
          git commit -m "Add ${{ inputs.rows }} benchmark output" || exit 0
          git pull --rebase origin main
          git push
